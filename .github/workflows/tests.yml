name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test,report]"
      - run: python -m pytest -q
  wheel-gui:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install the built wheel with GUI and test dependencies
        shell: bash
        run: python -m pip install "$(find dist -name '*.whl' -print -quit)[gui,test]"
      - run: python -m pytest -q tests/test_gui.py tests/test_examples.py tests/test_report_accounting.py tests/test_windows_installer.py
