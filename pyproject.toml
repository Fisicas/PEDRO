[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pedro-ped"
dynamic = ["version"]
description = "Harmonic mode assignments for molecules embedded in large ONIOM and QM/MM models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Raymond Nelson" }]
keywords = ["vibrational spectroscopy", "potential energy distribution", "normal modes", "QM/MM", "ONIOM", "GVPT2"]
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/Fisicas/PEDRO"
Issues = "https://github.com/Fisicas/PEDRO/issues"

[project.optional-dependencies]
gui = ["PySide6>=6.6", "matplotlib>=3.7"]
report = ["matplotlib>=3.7"]
test = ["pytest>=7", "setuptools>=77"]

[project.scripts]
pedro = "pedro.cli:main"

[project.gui-scripts]
pedro-gui = "pedro.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "pedro.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
pedro = ["gui/assets/*.svg"]
